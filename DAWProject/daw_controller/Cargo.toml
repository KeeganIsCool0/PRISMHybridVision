[package]
name = "daw_controller"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
hound = "3.4"
egui = "0.29"
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
midir = "0.8"